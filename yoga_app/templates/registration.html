{% extends "base.html" %}

{% block title %}Create Account — Yoga Studio AI{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-sm);">
  <div style="text-align: center; margin-bottom: 2rem;">
    <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.5rem;">
      <i class="fa-solid fa-user-plus"></i>
    </div>
    <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem;">Join Yoga Studio</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem;">Start your AI-assisted movement rehabilitation journey</p>
  </div>

  <form action="{{ url_for('register') }}" method="POST" style="display: flex; flex-direction: column; gap: 1.2rem;">
    <div>
      <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Full Name</label>
      <input type="text" name="fullname" required placeholder="e.g. Alex Morgan" 
             style="width: 100%; padding: 0.8rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border-light); border-radius: var(--radius-md); color: #fff;">
    </div>

    <div>
      <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Username</label>
      <input type="text" name="username" required placeholder="Choose a unique username" 
             style="width: 100%; padding: 0.8rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border-light); border-radius: var(--radius-md); color: #fff;">
    </div>

    <div>
      <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Email Address</label>
      <input type="email" name="email" required placeholder="alex@example.com" 
             style="width: 100%; padding: 0.8rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border-light); border-radius: var(--radius-md); color: #fff;">
    </div>

    <div>
      <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Password</label>
      <input type="password" name="password" required placeholder="6-20 chars (Upper, Lower, Number, Symbol)" 
             style="width: 100%; padding: 0.8rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border-light); border-radius: var(--radius-md); color: #fff;">
    </div>

    <div>
      <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Confirm Password</label>
      <input type="password" name="confirm_password" required placeholder="Re-enter password" 
             style="width: 100%; padding: 0.8rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border-light); border-radius: var(--radius-md); color: #fff;">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.85rem;">
      <i class="fa-solid fa-user-check"></i> Register Account
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.8rem; font-size: 0.9rem; color: var(--text-muted);">
    Already registered? <a href="{{ url_for('login') }}" style="color: var(--accent-cyan); font-weight: 600;">Sign In</a>
  </div>
</div>
{% endblock %}
